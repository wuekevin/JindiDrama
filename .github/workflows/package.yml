name: package
# 手动触发：生成未签名安装包，仅作为 artifact 上传（不发布 Release）。
on: workflow_dispatch
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: install NSIS (windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - name: build (windows, NSIS installer)
        if: runner.os == 'Windows'
        run: wails build -clean -nsis -skipbindings
      - name: build (macos)
        if: runner.os == 'macOS'
        run: |
          wails build -clean -platform darwin/universal -skipbindings
          cd build/bin && ditto -c -k --keepParent JindiDrama.app JindiDrama-macos-universal-unsigned.zip
      - name: list output
        shell: bash
        run: ls -la build/bin
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: |
            build/bin/*.exe
            build/bin/*.zip
