name: package
# 手动触发：生成测试或签名候选安装包，仅上传 artifact。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（如 v0.1.0）
        default: v0.1.0
      mode:
        description: 打包模式
        type: choice
        default: smoke
        options:
          - smoke
          - release

permissions:
  contents: read

jobs:
  package-release:
    if: inputs.mode == 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            signing_environment: release-windows
          - os: macos-latest
            signing_environment: release-macos
    runs-on: ${{ matrix.os }}
    environment: ${{ matrix.signing_environment }}
    env: &package_environment
      PACKAGE_MODE: ${{ inputs.mode }}
      PACKAGE_VERSION: ${{ inputs.version }}
      PACKAGE_DIR: build/bin
      LDFLAGS: -X jindi-drama/internal/app.Version=${{ inputs.version }}
      GOFLAGS: -mod=readonly
    steps: &package_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.mode == 'release' && '0' || '1' }}
      - name: verify distribution source history
        if: inputs.mode == 'release'
        shell: bash
        run: bash scripts/verify-distribution-source.sh
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: validate packaging inputs
        shell: bash
        run: |
          if [[ "$PACKAGE_MODE" != smoke && "$PACKAGE_MODE" != release ]]; then exit 1; fi
          core=$(go run ./cmd/validate-package-version -wails-config wails.json "$PACKAGE_VERSION")
          echo "PACKAGE_CORE_VERSION=$core" >> "$GITHUB_ENV"
      - name: validate macOS release credentials
        if: runner.os == 'macOS' && inputs.mode == 'release'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          missing=()
          for key in MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_SIGN_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!key}" ]]; then missing+=("$key"); fi
          done
          if (( ${#missing[@]} )); then
            echo "Missing release credentials: ${missing[*]}"
            exit 1
          fi
      - name: validate Windows release credentials
        if: runner.os == 'Windows' && inputs.mode == 'release'
        shell: bash
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          missing=()
          for key in WINDOWS_CERT_PFX WINDOWS_CERT_PASSWORD; do
            if [[ -z "${!key}" ]]; then missing+=("$key"); fi
          done
          if (( ${#missing[@]} )); then
            echo "Missing release credentials: ${missing[*]}"
            exit 1
          fi
      - name: build the frontend from its lockfile
        working-directory: frontend
        run: npm ci && npm run build
      - name: verify Go dependencies
        run: go mod download && go mod verify
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: install NSIS (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: build (windows, NSIS installer)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          Get-Command makensis
          wails build -s -m -nosyncgomod -clean -platform windows/amd64 -nsis -skipbindings -ldflags "$env:LDFLAGS"
          if (-not (Get-ChildItem build/bin/*installer*.exe)) { Write-Error "NSIS 安装包未生成"; exit 1 }
      - name: build and verify deployment target (macos)
        if: runner.os == 'macOS'
        env:
          CGO_CFLAGS: -mmacosx-version-min=13.0
          CGO_LDFLAGS: -mmacosx-version-min=13.0
        run: |
          wails build -s -m -nosyncgomod -clean -platform darwin/universal -skipbindings -ldflags "$LDFLAGS"
          app=build/bin/JindiDrama.app
          binary="$app/Contents/MacOS/JindiDrama"
          lipo "$binary" -verify_arch arm64 x86_64
          for key in CFBundleShortVersionString CFBundleVersion; do
            actual=$(plutil -extract "$key" raw "$app/Contents/Info.plist")
            test "$actual" = "$PACKAGE_CORE_VERSION"
          done
          target=$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")
          test "$target" = 13.0
          for arch in arm64 x86_64; do
            minimum=$(xcrun vtool -arch "$arch" -show-build "$binary" | awk '$1 == "minos" { print $2 }')
            if [[ "$minimum" != "$target" ]]; then
              echo "Unexpected deployment target for $arch: ${minimum:-missing}"
              exit 1
            fi
          done
      - name: confirm dependency files stayed unchanged
        run: git diff --exit-code -- go.mod go.sum frontend/package-lock.json
      - name: sign application (macos release)
        if: runner.os == 'macOS' && inputs.mode == 'release'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: exec bash scripts/sign-macos-release.sh sign build/bin/JindiDrama.app
      - name: notarize application (macos release)
        if: runner.os == 'macOS' && inputs.mode == 'release'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: exec bash scripts/sign-macos-release.sh notarize build/bin/JindiDrama.app
      - name: zip (macos)
        if: runner.os == 'macOS'
        working-directory: build/bin
        run: |
          ditto -c -k --keepParent JindiDrama.app JindiDrama-macos-universal.zip
          unzip -tq JindiDrama-macos-universal.zip
      - name: verify archived desktop startup (macos)
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          set -- build/bin/JindiDrama-macos-universal.zip --version "$PACKAGE_VERSION" --arch arm64 --diagnostics-dir "$RUNNER_TEMP/jindi-arm64-smoke"
          if [[ "$PACKAGE_MODE" == release ]]; then set -- "$@" --release; fi
          python3 scripts/smoke-macos-desktop.py "$@"
      - name: upload macOS startup diagnostics
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64-${{ inputs.mode }}-startup-diagnostics-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jindi-arm64-smoke/smoke.log
          if-no-files-found: ignore
      - name: sign application and installer (windows release)
        if: runner.os == 'Windows' && inputs.mode == 'release'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP ('jindidrama-sign-' + [Guid]::NewGuid().ToString('N'))
          $null = [IO.Directory]::CreateDirectory($work)
          $pfx = Join-Path $work 'certificate.pfx'
          $signed = 'build/bin/release-signed'
          $store = 'Cert:\CurrentUser\My'
          $signTool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          $newThumbprints = @()
          $importStarted = $false
          try {
            if (-not $signTool) { throw 'The Windows SDK SignTool was not found' }
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
            $password = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
            Remove-Item Env:WINDOWS_CERT_PFX, Env:WINDOWS_CERT_PASSWORD
            $pfxData = Get-PfxData -FilePath $pfx -Password $password
            $leaf = @($pfxData.EndEntityCertificates)
            if ($leaf.Count -ne 1 -or $leaf[0].Thumbprint -notmatch '^[0-9A-Fa-f]{40}$') {
              throw 'The Windows signing PFX must contain a single end-entity certificate'
            }
            $thumbprint = $leaf[0].Thumbprint
            $existing = @(Get-ChildItem -LiteralPath $store | ForEach-Object Thumbprint)
            if ($thumbprint -in $existing) { throw 'The Windows signing certificate already exists in the runner store' }
            $known = $leaf + @($pfxData.OtherCertificates)
            $newThumbprints = @($known | ForEach-Object Thumbprint | Where-Object { $_ -and $_ -notin $existing } | Select-Object -Unique)
            $importStarted = $true
            $null = Import-PfxCertificate -FilePath $pfx -CertStoreLocation $store -Password $password
            if (-not (Get-Item -LiteralPath (Join-Path $store $thumbprint)).HasPrivateKey) {
              throw 'The selected certificate has no accessible private key'
            }
            Remove-Item -LiteralPath $pfx -Force
            & ./scripts/sign-windows-package.ps1 -SigningThumbprint $thumbprint -SignTool $signTool -OutputDirectory $signed
            "PACKAGE_DIR=$signed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "JD_SIGNTOOL=$signTool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "JD_SIGN_THUMBPRINT=$thumbprint" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } finally {
            try {
              if ($importStarted) {
                foreach ($imported in $newThumbprints) {
                  $entry = Join-Path $store $imported
                  if (Test-Path -LiteralPath $entry) {
                    if ((Get-Item -LiteralPath $entry).HasPrivateKey) {
                      Remove-Item -LiteralPath $entry -DeleteKey
                    } else {
                      Remove-Item -LiteralPath $entry
                    }
                  }
                }
              }
            } finally {
              Remove-Item Env:WINDOWS_CERT_PFX, Env:WINDOWS_CERT_PASSWORD -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath $work -Recurse -Force
            }
          }
      - name: verify installer and WebView2 startup (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $inst = (Get-Item -LiteralPath (Join-Path $env:PACKAGE_DIR 'JindiDrama-amd64-installer.exe')).FullName
          $portable = (Get-Item -LiteralPath (Join-Path $env:PACKAGE_DIR 'JindiDrama.exe')).FullName
          $expected = "${env:PACKAGE_CORE_VERSION}.0"
          foreach ($binary in @($portable, $inst)) {
            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $binary).Path)
            $product = "$($info.ProductMajorPart).$($info.ProductMinorPart).$($info.ProductBuildPart).$($info.ProductPrivatePart)"
            $file = "$($info.FileMajorPart).$($info.FileMinorPart).$($info.FileBuildPart).$($info.FilePrivatePart)"
            if ($product -ne $expected -or $file -ne $expected) {
              throw "Unexpected package version for ${binary}: product=$product file=$file expected=$expected"
            }
          }
          $nativeProbe = Join-Path $env:RUNNER_TEMP 'jindi-windows-desktop-smoke.exe'
          go build -o $nativeProbe ./cmd/windows-desktop-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Windows desktop smoke probe could not be built' }
          $startupRegistryPath = 'Software\Microsoft\Windows\CurrentVersion\Run'
          $preInstallRun = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey($startupRegistryPath)
          try {
            if ($preInstallRun -and $preInstallRun.GetValueNames() -contains 'JindiDrama') {
              throw 'A JindiDrama Run entry already exists on the runner'
            }
          } finally {
            if ($preInstallRun) { $preInstallRun.Dispose() }
          }
          $protocolKey = 'Registry::HKEY_CLASSES_ROOT\jindi'
          if (Test-Path -LiteralPath $protocolKey) { throw 'A jindi URL handler already exists on the runner' }
          $install = Start-Process -FilePath $inst -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $exe = "C:\Program Files\JindiDrama\JindiDrama.exe"
          $uninstaller = "C:\Program Files\JindiDrama\uninstall.exe"
          $checkFailure = $null
          $fixtureDirectory = $null
          $fixtureFile = $null
          $fixtureHash = $null
          $runKey = $null
          $runFixture = $null
          $uninstallWorker = $null
          try {
            if (-not (Test-Path $exe)) { throw "安装目录不符，$exe 不存在" }
            if (Test-Path "C:\Program Files\JindiDrama\JindiDrama\JindiDrama.exe") { throw "安装目录多了一层 JindiDrama" }
            $desk = @("C:\Users\Public\Desktop", [Environment]::GetFolderPath("Desktop")) | ForEach-Object { Join-Path $_ "金帝短剧.lnk" }
            if (-not ($desk | Where-Object { Test-Path $_ })) { throw "桌面快捷方式「金帝短剧」不存在" }
            $packaged = (Get-FileHash -LiteralPath $portable).Hash
            if ((Get-FileHash $exe).Hash -ne $packaged) { throw "Installed application differs from packaged executable" }
            Write-Host "安装目录与中文桌面快捷方式验证通过"
            $protocol = Get-Item -LiteralPath $protocolKey
            $command = $null
            try {
              $command = $protocol.OpenSubKey('shell\open\command')
              if ($null -eq $command -or $protocol.GetValueNames() -cnotcontains 'URL Protocol' -or
                  $command.GetValue('') -cne ('"' + $exe + '" "%1"')) {
                throw 'Installer did not register the expected jindi URL handler'
              }
            } finally {
              if ($command) { $command.Dispose() }
              $protocol.Dispose()
            }
            $fixtureDirectory = Join-Path (Split-Path -Parent $exe) ('jindi-uninstall-fixture-' + [Guid]::NewGuid().ToString('N'))
            $null = [IO.Directory]::CreateDirectory($fixtureDirectory)
            $fixtureFile = Join-Path $fixtureDirectory 'keep.txt'
            [IO.File]::WriteAllText($fixtureFile, 'This file was not installed by JindiDrama.')
            $fixtureHash = (Get-FileHash -LiteralPath $fixtureFile).Hash
            & ./scripts/smoke-windows-desktop.ps1 -Application $exe -ExpectedVersion $env:PACKAGE_VERSION -NativeProbe $nativeProbe
            & ./scripts/smoke-windows-desktop.ps1 -Application $portable -ExpectedVersion $env:PACKAGE_VERSION -NativeProbe $nativeProbe
            & ./scripts/smoke-windows-desktop.ps1 -Application $exe -ExpectedVersion $env:PACKAGE_VERSION -CloseScenario Minimize -NativeProbe $nativeProbe -VerifyCMSProtocol
            & ./scripts/smoke-windows-desktop.ps1 -Application $portable -ExpectedVersion $env:PACKAGE_VERSION -CloseScenario Tray -NativeProbe $nativeProbe
            $runKey = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey($startupRegistryPath)
            if ($runKey.GetValueNames() -contains 'JindiDrama') { throw 'A JindiDrama Run entry already exists on the runner' }
            $runFixture = '"' + $exe + '"'
            $runKey.SetValue('JindiDrama', $runFixture, [Microsoft.Win32.RegistryValueKind]::String)
            # This runner-only payload stands in for an older installed executable.
            [IO.File]::AppendAllText($exe, 'JindiDrama upgrade test marker')
            $beforeBlockedApp = (Get-FileHash -LiteralPath $exe).Hash
            $beforeBlockedUpgrade = (Get-FileHash -LiteralPath $uninstaller).Hash
            $lockedUpgrade = [IO.File]::Open($exe, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
            try {
              $blockedUpgrade = Start-Process -FilePath $inst -ArgumentList '/S' -PassThru
              try {
                if (-not $blockedUpgrade.WaitForExit(45000)) {
                  $blockedUpgrade.Kill($true)
                  [void]$blockedUpgrade.WaitForExit(5000)
                  throw 'Locked upgrade did not exit promptly'
                }
                if ($blockedUpgrade.ExitCode -ne 1 -or
                    (Get-FileHash -LiteralPath $exe).Hash -ne $beforeBlockedApp -or
                    (Get-FileHash -LiteralPath $uninstaller).Hash -ne $beforeBlockedUpgrade -or
                    $runKey.GetValue('JindiDrama') -cne $runFixture) {
                  throw 'Locked upgrade must fail and preserve the installed app, uninstaller, and Run entry'
                }
              } finally {
                $blockedUpgrade.Dispose()
              }
            } finally {
              $lockedUpgrade.Dispose()
            }
            $upgrade = Start-Process -FilePath $inst -ArgumentList '/S' -Wait -PassThru
            if ($upgrade.ExitCode -ne 0 -or (Get-FileHash -LiteralPath $exe).Hash -ne $packaged -or
                $runKey.GetValue('JindiDrama') -cne $runFixture) {
              throw 'An in-place upgrade must replace the app and preserve the current Run entry'
            }
          } catch {
            $checkFailure = $_
          } finally {
            try {
              if ($env:PACKAGE_MODE -eq "release") {
                & ./scripts/sign-windows-release.ps1 -File $uninstaller -VerifyOnly
              }
              $uninstallWorker = Join-Path $env:RUNNER_TEMP ('jindi-uninstall-' + [Guid]::NewGuid().ToString('N') + '.exe')
              [IO.File]::Copy($uninstaller, $uninstallWorker)
              $installDirectory = Split-Path -Parent $exe
              # NSIS requires _?= last and without quotes. This avoids the launcher returning before its worker.
              $uninstallArgs = "/S _?=$installDirectory"
              $lockCheckFailure = $null
              if ($null -eq $checkFailure) {
                try {
                  $locked = [IO.File]::Open($exe, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
                  try {
                    $blocked = Start-Process -FilePath $uninstallWorker -ArgumentList $uninstallArgs -Wait -PassThru
                    if ($blocked.ExitCode -eq 0 -or -not (Test-Path -LiteralPath $exe) -or
                        -not (Test-Path -LiteralPath $uninstaller)) {
                      throw "Uninstall must report a locked application and preserve the retry entry"
                    }
                    if ($runKey.GetValue('JindiDrama') -cne $runFixture) {
                      throw 'A failed uninstall must preserve the original Run entry'
                    }
                  } finally {
                    $locked.Dispose()
                  }
                } catch {
                  $lockCheckFailure = $_
                }
              }
              $uninstall = Start-Process -FilePath $uninstallWorker -ArgumentList $uninstallArgs -Wait -PassThru
              if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
              if (Test-Path -LiteralPath $exe) { throw "Application remains after uninstall" }
              if (Test-Path -LiteralPath $uninstaller) { throw "Uninstaller remains after uninstall" }
              if ($fixtureHash) {
                if (-not (Test-Path -LiteralPath $fixtureFile -PathType Leaf) -or
                    (Get-FileHash -LiteralPath $fixtureFile).Hash -ne $fixtureHash) {
                  throw "Uninstall removed or altered an unrelated file in the installation directory"
                }
                Write-Host "Uninstall preserved the unrelated file and its SHA-256"
              }
              if ($lockCheckFailure) { throw $lockCheckFailure }
              if ($null -eq $checkFailure) {
                if ($runKey.GetValueNames() -contains 'JindiDrama') { throw 'The installed application Run entry remains after uninstall' }
                if (Test-Path -LiteralPath $protocolKey) { throw 'The installed jindi URL handler remains after uninstall' }

                # A second install and uninstall must preserve the same value name for a different executable path.
                $runFixture = '"' + (Join-Path $env:RUNNER_TEMP ('other-jindi-' + [Guid]::NewGuid().ToString('N') + '.exe')) + '"'
                $runKey.SetValue('JindiDrama', $runFixture, [Microsoft.Win32.RegistryValueKind]::String)
                $reinstall = Start-Process -FilePath $inst -ArgumentList '/S' -Wait -PassThru
                if ($reinstall.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $exe -PathType Leaf) -or
                    -not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
                  throw "Second installation failed with exit code $($reinstall.ExitCode) or missing files"
                }
                $installedRun = $runKey.GetValue('JindiDrama')
                if ($env:PACKAGE_MODE -eq "release") {
                  & ./scripts/sign-windows-release.ps1 -File $uninstaller -VerifyOnly
                }
                [IO.File]::Copy($uninstaller, $uninstallWorker, $true)
                $secondUninstall = Start-Process -FilePath $uninstallWorker -ArgumentList $uninstallArgs -Wait -PassThru
                if ($secondUninstall.ExitCode -ne 0 -or (Test-Path -LiteralPath $exe) -or (Test-Path -LiteralPath $uninstaller)) {
                  throw 'Second installation could not be removed'
                }
                if ($installedRun -cne $runFixture -or $runKey.GetValue('JindiDrama') -cne $runFixture) {
                  throw 'Install and uninstall must preserve a Run entry for a different executable'
                }
                if (Test-Path -LiteralPath $protocolKey) { throw 'The reinstalled jindi URL handler remains after uninstall' }
                Write-Host 'Uninstall removed the matching Run entry and preserved a different one'
              }
            } catch {
              if ($null -eq $checkFailure) { throw }
              Write-Warning "Uninstall also failed: $_"
            } finally {
              if ($runKey) {
                try {
                  if ($runFixture -and $runKey.GetValue('JindiDrama') -ceq $runFixture) {
                    $runKey.DeleteValue('JindiDrama', $false)
                  }
                } catch {
                  Write-Warning "Could not clean up the Run entry fixture: $_"
                } finally {
                  $runKey.Dispose()
                }
              }
              try {
                if ($uninstallWorker) { [IO.File]::Delete($uninstallWorker) }
                if ($fixtureFile) { [IO.File]::Delete($fixtureFile) }
                if ($fixtureDirectory -and [IO.Directory]::Exists($fixtureDirectory)) {
                  [IO.Directory]::Delete($fixtureDirectory)
                }
              } catch {
                Write-Warning "Could not clean up the uninstall test fixture: $_"
              }
            }
          }
          if ($checkFailure) { throw $checkFailure }
      - name: collect privacy and license notices
        shell: bash
        run: node scripts/package-notices.mjs "$PACKAGE_DIR"
      - name: generate release notes
        shell: bash
        run: node scripts/package-release-notes.mjs "$PACKAGE_DIR"
      - name: generate SHA-256 checksums
        shell: bash
        run: node scripts/package-checksums.mjs "$PACKAGE_DIR"
      - name: list output
        shell: bash
        run: ls -la "$PACKAGE_DIR"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.mode == 'release' && format('release-{0}-attempt-{1}', matrix.os, github.run_attempt) || format('package-{0}-attempt-{1}', matrix.os, github.run_attempt) }}
          if-no-files-found: error
          path: |
            ${{ env.PACKAGE_DIR }}/*.exe
            ${{ env.PACKAGE_DIR }}/*.zip
            ${{ env.PACKAGE_DIR }}/RELEASE-NOTES.md
            ${{ env.PACKAGE_DIR }}/RELEASE-ROLLBACK.md
            ${{ env.PACKAGE_DIR }}/PRIVACY.md
            ${{ env.PACKAGE_DIR }}/FRONTEND-LICENSES.md
            ${{ env.PACKAGE_DIR }}/GO-LICENSES.md
            ${{ env.PACKAGE_DIR }}/SHA256SUMS.txt
  package:
    if: inputs.mode == 'smoke'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env: *package_environment
    steps: *package_steps

  verify-windows-download:
    needs: [package, package-release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      PACKAGE_MODE: ${{ inputs.mode }}
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.mode == 'release' && format('release-windows-latest-attempt-{0}', github.run_attempt) || format('package-windows-latest-attempt-{0}', github.run_attempt) }}
          path: build/bin
      - name: verify downloaded Windows packages
        run: node scripts/package-checksums.mjs --verify-hosted windows build/bin

  verify-macos-intel:
    needs: [package, package-release]
    if: ${{ !cancelled() }}
    runs-on: macos-15-intel
    env:
      PACKAGE_MODE: ${{ inputs.mode }}
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.mode == 'release' && format('release-macos-latest-attempt-{0}', github.run_attempt) || format('package-macos-latest-attempt-{0}', github.run_attempt) }}
          path: build/bin
      - name: verify the downloaded Universal archive on Intel
        run: |
          test "$(uname -m)" = x86_64
          node scripts/package-checksums.mjs --verify-hosted macos build/bin
          set -- build/bin/JindiDrama-macos-universal.zip --version "$PACKAGE_VERSION" --arch amd64 --diagnostics-dir "$RUNNER_TEMP/jindi-intel-smoke"
          if [[ "$PACKAGE_MODE" == release ]]; then set -- "$@" --release; fi
          python3 scripts/smoke-macos-desktop.py "$@"
      - name: upload Intel startup diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-intel-${{ inputs.mode }}-startup-diagnostics-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jindi-intel-smoke/smoke.log
          if-no-files-found: ignore

  assemble-release:
    needs: [package-release, verify-windows-download, verify-macos-intel]
    if: >-
      ${{
        !cancelled() && inputs.mode == 'release' &&
        needs.package-release.result == 'success' &&
        needs.verify-windows-download.result == 'success' &&
        needs.verify-macos-intel.result == 'success'
      }}
    runs-on: ubuntu-latest
    env:
      PACKAGE_MODE: ${{ inputs.mode }}
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows-latest-attempt-${{ github.run_attempt }}
          path: release-input/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macos-latest-attempt-${{ github.run_attempt }}
          path: release-input/macos
      - name: assemble and verify the release handoff
        run: node scripts/assemble-release.mjs release-input/windows release-input/macos release-handoff
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-handoff-${{ inputs.version }}-attempt-${{ github.run_attempt }}
          path: release-handoff/
          if-no-files-found: error
