name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: node --test scripts/package-checksums.test.mjs scripts/assemble-release.test.mjs
      - shell: bash
        run: bash scripts/test-verify-distribution-source.sh
      - if: runner.os == 'macOS'
        run: python3 -m unittest discover -s scripts -p 'test_macos_*.py'
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-smoke-session.ps1
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-sign-windows-release.ps1
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          JINDI_E2E_PREBUILT: '1'
      - run: go vet ./... && go test ./...
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - run: wails build -s -m -nosyncgomod -skipbindings
        env:
          CGO_CFLAGS: ${{ runner.os == 'macOS' && '-mmacosx-version-min=13.0' || '' }}
          CGO_LDFLAGS: ${{ runner.os == 'macOS' && '-mmacosx-version-min=13.0' || '' }}
      - run: git diff --exit-code -- go.mod go.sum frontend/package-lock.json
      # 冒烟：产物存在（未签名；签名/公证需证书，见 docs/STATUS.md）
      - name: smoke (binary exists)
        shell: bash
        run: ls build/bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.os }}
          path: build/bin
